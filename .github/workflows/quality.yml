name: quality

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: affirmative
          POSTGRES_PASSWORD: affirmative
          POSTGRES_DB: affirmative_pill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U affirmative -d affirmative_pill"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://affirmative:affirmative@localhost:5432/affirmative_pill
      PROJECTION_MODE: inline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run db:prepare
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
